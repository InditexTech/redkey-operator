apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redkey-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redkey-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "redkey-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $ann := dict }}
      {{- if and .Values.metrics.enabled .Values.metrics.annotations.enabled }}
      {{- $_ := set $ann "prometheus.io/scrape" "true" }}
      {{- $_ := set $ann "prometheus.io/path" .Values.metrics.annotations.path }}
      {{- $_ := set $ann "prometheus.io/port" (.Values.metrics.port | toString) }}
      {{- $_ := set $ann "prometheus.io/scheme" (ternary "https" "http" .Values.metrics.secure) }}
      {{- end }}
      {{- range $key, $value := .Values.podAnnotations }}
      {{- $_ := set $ann $key $value }}
      {{- end }}
      {{- if $ann }}
      annotations:
        {{- toYaml $ann | nindent 8 }}
      {{- end }}
      labels:
        {{- include "redkey-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "redkey-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          command:
            - /manager
          args:
            - "--leader-elect={{ .Values.leaderElection.enabled }}"
            {{- if .Values.metrics.enabled }}
            - "--metrics-bind-address=:{{ .Values.metrics.port }}"
            - "--metrics-secure={{ .Values.metrics.secure }}"
            {{- else }}
            - "--metrics-bind-address=0"
            {{- end }}
          env:
            - name: WATCH_NAMESPACE
              value: {{ .Release.Namespace }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}