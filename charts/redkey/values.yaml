# Redkey name (defaults to release name)
nameOverride: ""

# Deployment mode: "cluster" (Redis Cluster, default) or "standalone" (single instance).
# Standalone is immutable and limited to a single primary with no replicas.
mode: cluster

primaries: 3
replicasPerPrimary: 0
ephemeral: true
purgeKeysOnRebalance: true
image: redis:8-bookworm
version: ""

# Storage (only for non-ephemeral clusters)
storage: ""
storageClassName: ""
accessModes:
  - ReadWriteOnce

deletePVC: false
skipIfSuperseded: true
# backup: false

# Authentication - reference a Secret containing Redis credentials
# auth:
#   secret: my-redis-secret

# Labels/annotations propagated to all managed objects and their pods (Redis
# StatefulSet/Service/ConfigMap/PDB, Robin Deployment and its RBAC).
labels: {}
annotations: {}

# Labels/annotations set ONLY on the Redkey CR object metadata (NOT propagated to
# children). Use for platform integrations that read the CR directly.
crLabels: {}
crAnnotations: {}

# Labels/annotations applied ONLY to the Redis pods (equivalent to the old operator's
# inditex.com/nodes-extra-labels / nodes-extra-annotations), e.g. for log scraping.
# Implemented via the StatefulSet pod-template override; global .Values.labels /
# .Values.annotations are merged in so they are preserved on the Redis pods.
# redisPodLabels:
#   log-scrape: "true"
# redisPodAnnotations:
#   log-format: "lineformat"
redisPodLabels: {}
redisPodAnnotations: {}

config: |
  maxmemory 90mb
  maxmemory-samples 5
  maxmemory-policy allkeys-lru
  protected-mode no
  appendonly no
  save ""

resources:
  limits:
    cpu: 100m
    memory: 128Mi

# PodDisruptionBudget configuration
# pdb:
#   enabled: true
#   pdbSizeUnavailable: 1

# Override generated child resources (StatefulSet, Service)
# override:
#   statefulSet: {}
#   service: {}

robin:
  image: ghcr.io/inditextech/redkey-robin:0.1.0
  imagePullPolicy: Always
  resources:
    requests:
      cpu: 500m
      memory: 100Mi
    limits:
      cpu: 1
      memory: 200Mi
  # Extra labels/annotations to place on the Robin pod (the metrics/lifecycle manager).
  # Global .Values.labels / .Values.annotations are preserved on the Robin pod.
  podLabels: {}
  podAnnotations: {}

  # Prometheus scraping of Robin metrics (exposed at :8080/metrics).
  # When enabled, the prometheus.io/* annotations below are added to the Robin pod.
  # Global .Values.annotations are also preserved on the Robin pod.
  metricsScraping:
    enabled: true
    port: "8080"
    path: /metrics
    scheme: http
  config:
    reconciler:
      intervalSeconds: 30
      intervalOnErrorSeconds: 10
      intervalOnWaitSeconds: 10
    cluster:
      connectionMaxRetries: 10
      connectionBackOffSeconds: 10
      clusterCommandTimeoutSeconds: 24
      rebalanceTimeoutSeconds: 600
      clusterMeetWaitSeconds: 5
    metrics:
      collectionIntervalSeconds: 60
      metricsLabels: {}
      redisInfoKeys:
        - keyspace_hits
        - evicted_keys
        - connected_clients
        - total_commands_processed
        - keyspace_misses
        - expired_keys
        - redis_version
        - used_memory_rss
        - maxmemory
        - used_cpu_sys
        - used_cpu_sys_children
        - used_cpu_user
        - used_cpu_user_children
        - total_net_input_bytes
        - total_net_output_bytes
        - aof_base_size
        - aof_current_size
        - mem_aof_buffer

# Post-install hook that waits for the Redkey to be Ready.
# All RBAC resources are auto-created and auto-cleaned by Helm hooks.
waitReady:
  enabled: false
  image: bitnami/kubectl:latest
  timeout: "300s"
  backoffLimit: 3
