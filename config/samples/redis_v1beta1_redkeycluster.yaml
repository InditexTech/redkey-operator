apiVersion: redkey.inditex.dev/v1beta1
kind: RedkeyCluster
metadata:
  labels:
    app.kubernetes.io/name: redkey-operator
    app.kubernetes.io/managed-by: kustomize
  name: redkey-cluster-sample
spec:
  primaries: 3
  # replicasPerPrimary: 1
  ephemeral: true
  accessModes:
    - ReadWriteOnce
  image: redis:8-bookworm
  purgeKeysOnRebalance: true
  labels:
    team: a-team
    custom: custom-label
  config: |
    maxmemory 90mb
    maxmemory-samples 5
    maxmemory-policy allkeys-lru
    protected-mode no
    appendonly no
    save ""
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
  robin:
    image: ghcr.io/inditextech/redkey-robin:latest
    resources:
      requests:
        cpu: 500m
        memory: 100Mi
      limits:
        cpu: 1
        memory: 200Mi
    config:
      reconciler:
        intervalSeconds: 30
        intervalOnErrorSeconds: 10
        intervalOnWaitSeconds: 10
      cluster:
        connectionMaxRetries: 10
        connectionBackOffSeconds: 10
        clusterCommandTimeoutSeconds: 24
        rebalanceTimeoutSeconds: 120
        clusterMeetWaitSeconds: 5
      metrics:
        collectionIntervalSeconds: 60
        redisInfoKeys:
          - keyspace_hits
          - evicted_keys
          - connected_clients
          - total_commands_processed
          - keyspace_misses
          - expired_keys
          - redis_version
          - used_memory_rss
          - maxmemory
          - used_cpu_sys
          - used_cpu_sys_children
          - used_cpu_user
          - used_cpu_user_children
          - total_net_input_bytes
          - total_net_output_bytes
          - aof_base_size
          - aof_current_size
          - mem_aof_buffer
      profiling:
        enabled: true
