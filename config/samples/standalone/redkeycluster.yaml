apiVersion: redkey.inditex.dev/v1beta1
kind: RedkeyCluster
metadata:
  annotations:
    inditex.dev/description: "Standalone Redis for development purposes"
  labels:
    inditex.dev/name: redkey-standalone
    inditex.dev/owner: a-team
    inditex.dev/environment: development
    app.kubernetes.io/managed-by: kustomize
  name: redkey-standalone
spec:
  # Standalone mode deploys a single, non-clustered Redis instance
  # (cluster-enabled no). It is immutable once set and restricts the
  # cluster to at most one primary (primaries: 0 or 1) with no replicas.
  mode: standalone
  primaries: 1
  replicasPerPrimary: 0
  ephemeral: false
  storage: "1Gi"
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  image: redis:8-bookworm
  purgeKeysOnRebalance: false
  labels:
    team: a-team
  config: |
    maxmemory 90mb
    maxmemory-samples 5
    maxmemory-policy allkeys-lru
    protected-mode no
    appendonly yes
    appendfsync everysec
    save 3600 1
    save 300 100
    save 60 10000
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
  robin:
    image: ghcr.io/inditextech/redkey-robin:latest
    resources:
      requests:
        cpu: 200m
        memory: 100Mi
      limits:
        cpu: 400m
        memory: 200Mi
    config:
      reconciler:
        intervalSeconds: 30
        intervalOnErrorSeconds: 10
        intervalOnWaitSeconds: 10
      cluster:
        connectionMaxRetries: 10
        connectionBackOffSeconds: 10
        clusterCommandTimeoutSeconds: 24
        rebalanceTimeoutSeconds: 600
        clusterMeetWaitSeconds: 5
      metrics:
        collectionIntervalSeconds: 60
        redisInfoKeys:
          - keyspace_hits
          - evicted_keys
          - connected_clients
          - total_commands_processed
          - keyspace_misses
          - expired_keys
          - redis_version
          - used_memory_rss
          - maxmemory
          - used_cpu_sys
          - used_cpu_sys_children
          - used_cpu_user
          - used_cpu_user_children
          - total_net_input_bytes
          - total_net_output_bytes
          - aof_base_size
          - aof_current_size
          - mem_aof_buffer
      profiling:
        enabled: true
