apiVersion: redkey.inditex.dev/v1beta1
kind: RedkeyCluster
metadata:
  annotations:
    inditex.dev/description: "Ephemeral authenticated Redis Cluster for development purposes"
  labels:
    inditex.dev/name: redkey-cluster-auth
    inditex.dev/owner: a-team
    inditex.dev/environment: development
    app.kubernetes.io/managed-by: kustomize
  name: redkey-cluster-auth
spec:
  mode: cluster
  primaries: 3
  ephemeral: true
  accessModes:
    - ReadWriteOnce
  image: redis:8-bookworm
  purgeKeysOnRebalance: true
  auth:
    secret: redkey-auth-sample
  labels:
    team: a-team
  config: |
    maxmemory 90mb
    maxmemory-samples 5
    maxmemory-policy allkeys-lru
    protected-mode no
    appendonly no
    save ""
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
  robin:
    image: ghcr.io/inditextech/redkey-robin:latest
    resources:
      requests:
        cpu: 200m
        memory: 100Mi
      limits:
        cpu: 400m
        memory: 200Mi
    config:
      reconciler:
        intervalSeconds: 30
        intervalOnErrorSeconds: 10
        intervalOnWaitSeconds: 10
      cluster:
        connectionMaxRetries: 10
        connectionBackOffSeconds: 10
        clusterCommandTimeoutSeconds: 24
        rebalanceTimeoutSeconds: 600
        clusterMeetWaitSeconds: 5
      metrics:
        collectionIntervalSeconds: 60
